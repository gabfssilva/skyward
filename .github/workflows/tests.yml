name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Install Task
      uses: Wandalen/wretry.action@v3
      with:
        action: arduino/setup-task@v2
        with: |
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        attempt_limit: 3
        attempt_delay: 10000
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: task setup
    - name: Lint
      run: task lint
    - name: Type check
      run: task typecheck
    - name: Layer contracts
      run: task lint:imports
    - name: Local tests
      run: task test:local

  build-image:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    name: build-image / ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Install Task
      uses: Wandalen/wretry.action@v3
      with:
        action: arduino/setup-task@v2
        with: |
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        attempt_limit: 3
        attempt_delay: 10000
    - name: Login to GHCR
      uses: Wandalen/wretry.action@v3
      with:
        action: docker/login-action@v3
        with: |
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        attempt_limit: 3
        attempt_delay: 10000
    - name: Build base image
      run: task docker:build PYTHON_VERSION=${{ matrix.python-version }}
    - name: Push base image
      uses: Wandalen/wretry.action@v3
      with:
        command: task docker:push PYTHON_VERSION=${{ matrix.python-version }}
        attempt_limit: 3
        attempt_delay: 10000

  compute:
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        feature: [access, dispatch, environment, lifecycle, output, shared_state, streaming, topology]

    name: compute / ${{ matrix.feature }} / ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Install Task
      uses: Wandalen/wretry.action@v3
      with:
        action: arduino/setup-task@v2
        with: |
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        attempt_limit: 3
        attempt_delay: 10000
    - name: Login to GHCR
      uses: Wandalen/wretry.action@v3
      with:
        action: docker/login-action@v3
        with: |
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        attempt_limit: 3
        attempt_delay: 10000
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: task setup
    - name: Generate SSH key
      run: ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
    - name: Run ${{ matrix.feature }} tests
      run: task test:compute -- tests/test_${{ matrix.feature }}.py
