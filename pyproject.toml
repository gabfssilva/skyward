[project]
name = "skyward"
dynamic = ["version"]
description = "Execute Python functions on cloud compute with a simple decorator"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Gabriel Francisco"}]
keywords = ["cloud", "distributed", "gpu", "serverless", "compute"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

# What a bare node needs: it runs the worker and nothing else.
dependencies = [
    "casty>=0.22.1",
    "cloudpickle>=3.1",
    "loky>=3.5",
    "lz4>=4.3",
    "msgspec>=0.19",
]

[project.optional-dependencies]
# What the SDK needs to reach a control plane — any control plane, including one
# running in the same process.
client = [
    "httpx>=0.28",
]
# The live terminal dashboard. Without it the pool still prints its log, one
# line at a time — the extra buys the pinned panel, not the ability to watch.
tui = [
    "rich>=13.7",
]
# What the daemon needs and the node does not. A machine rented by the hour
# should not be waiting on a web framework it will never serve with.
server = [
    "httpx>=0.28",
    "litestar>=2.13",
    "piccolo[sqlite]>=1.0",
    "asyncssh>=2.22.0",
    "aioboto3>=13.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "skyward/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["skyward"]

[tool.ruff]
target-version = "py312"
line-length = 160
exclude = ["skyward/_version.py", "tests/**", "guides/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
ignore = [
    "ANN401",  # Allow Any for serialization functions
    "UP046",   # Keep Generic[T] style for broader IDE support
    "UP047",   # Keep Generic function style for broader IDE support
    "N802",    # Allow PascalCase for constructor-style functions
]

[tool.ruff.lint.isort]
known-first-party = ["skyward"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"guides/**" = ["ANN"]
"skyward/server/controllers/**" = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["skyward"]
reportMissingImports = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--durations=0 --dist loadgroup -n auto --log-cli-level=WARNING -m 'not sanity and not integration'"
timeout_func_only = true
markers = [
    "unit: fast unit tests with no external dependencies",
    "e2e: end-to-end tests requiring container runtime",
    "slow: tests that take >10s",
    "integration: marks tests as integration tests (require Docker)",
    "sanity: provider sanity tests (real cloud, real GPUs)",
    "aws: AWS provider tests",
    "runpod: RunPod provider tests",
    "vastai: VastAI provider tests",
    "verda: Verda provider tests",
    "gcp: GCP provider tests",
    "hyperstack: Hyperstack provider tests",
    "jarvislabs: Jarvis Labs provider tests",
    "massed_compute: Massed Compute provider tests",
    "novita: Novita provider tests",
    "tensordock: TensorDock provider tests",
    "scaleway: Scaleway provider tests",
    "vultr: Vultr provider tests",
    "lambda_cloud: Lambda Cloud provider tests",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1",
    "ruff>=0.9",
    "litestar>=2.13",
    "piccolo[sqlite]>=1.0",
    "asyncssh>=2.22.0",
    "aioboto3>=13.0.0",
    "httpx>=0.28",
    "rich>=13.7",
    "jax>=0.8.2",
    "keras>=3.13.0",
    "scikit-learn>=1.8.0",
]

[tool.uv]
# casty is ours; opt it out of the global 7-day exclude-newer quarantine.
exclude-newer-package = { casty = "0 seconds" }
