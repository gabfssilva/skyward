[project]
name = "skyward"
dynamic = ["version"]
description = "Execute Python functions on cloud compute with a simple decorator"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Gabriel Francisco"}]
keywords = ["cloud", "distributed", "gpu", "serverless", "compute"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

# What a bare node needs: it runs the worker and nothing else.
dependencies = [
    "casty>=0.22.1",
    "cloudpickle>=3.1",
    "loky>=3.5",
    "lz4>=4.3",
    "msgspec>=0.19",
]

[project.optional-dependencies]
# What the SDK needs to reach a control plane — any control plane, including one
# running in the same process.
client = [
    "httpx>=0.28",
]
# The live terminal dashboard. Without it the pool still prints its log, one
# line at a time — the extra buys the pinned panel, not the ability to watch.
tui = [
    "rich>=13.7",
]
# What the daemon needs and the node does not. A machine rented by the hour
# should not be waiting on a web framework it will never serve with.
server = [
    "httpx>=0.28",
    "litestar>=2.13",
    "piccolo[sqlite]>=1.0",
    "asyncssh>=2.22.0",
    "uvicorn>=0.30",
    # The daemon mints a certificate authority per compute and signs its members.
    # The node only reads the three files it is handed, so this stops here.
    "cryptography>=42",
]
# Three adapters need an sdk of their own; the other twelve speak plain HTTP
# through httpx. An adapter whose sdk is absent is not registered, so `server`
# buys the daemon and these buy the clouds it can reach.
aws = [
    "aioboto3>=13.0.0",
]
gcp = [
    "cryptography>=42",
]
salad = [
    "salad-cloud-sdk>=0.9.0a17",
    "websockets>=13",
]
providers = [
    "skyward[aws,gcp,salad]",
]
# The `sky` command. A node installs skyward to run a function and has no
# business acquiring an argument parser to do it.
cli = [
    "cyclopts>=3.0",
]
# A local Jupyter whose kernel runs on a compute (`skyward.notebook`). Client
# side only: jupyter-client and traitlets are what the provisioner imports, and
# ipykernel is what the machine launches — the image needs it, this does not.
notebook = [
    "jupyter-client>=8.0",
    "traitlets>=5.0",
    "ipykernel>=6.0",
]
# The user-facing object storage module (`skyward.storage`). Its S3 client is
# imported lazily, so the dependency is only needed when a Storage is opened.
storage = [
    "aioboto3>=13.0.0",
]
# Everything skyward ships, for the machine that is developing against it rather
# than running one job.
all = [
    "skyward[client,server,cli,tui,notebook,storage,providers]",
]

[project.scripts]
sky = "skyward.cli:app"

[project.entry-points."jupyter_client.kernel_provisioners"]
skyward = "skyward.core.notebook.provisioner:SkywardKernelProvisioner"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "skyward/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["skyward"]

[tool.ruff]
target-version = "py312"
line-length = 160
exclude = ["skyward/_version.py", "tests/.old/**", "guides/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
ignore = [
    "ANN401",  # Allow Any for serialization functions
    "UP046",   # Keep Generic[T] style for broader IDE support
    "UP047",   # Keep Generic function style for broader IDE support
    "N802",    # Allow PascalCase for constructor-style functions
]

[tool.ruff.lint.isort]
known-first-party = ["skyward"]

[tool.ruff.lint.per-file-ignores]
"guides/**" = ["ANN"]
"skyward/server/http/controllers/**" = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["skyward", "tests"]
exclude = ["tests/.old"]
reportMissingImports = "warning"
reportTypedDictNotRequiredAccess = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--durations=0 --dist loadgroup -n auto --log-cli-level=WARNING -m 'not sanity'"
timeout = 480
timeout_method = "thread"
markers = [
    "compute: features that need a live pool, and so a container runtime",
    "local: features that need nothing but this process",
    "sanity: provider sanity tests (real cloud, real GPUs)",
    "aws: AWS provider tests",
    "runpod: RunPod provider tests",
    "vastai: VastAI provider tests",
    "verda: Verda provider tests",
    "gcp: GCP provider tests",
    "hyperstack: Hyperstack provider tests",
    "jarvislabs: Jarvis Labs provider tests",
    "massed_compute: Massed Compute provider tests",
    "novita: Novita provider tests",
    "tensordock: TensorDock provider tests",
    "scaleway: Scaleway provider tests",
    "vultr: Vultr provider tests",
    "lambda_cloud: Lambda Cloud provider tests",
    "salad: Salad Cloud provider tests",
]

[tool.coverage.run]
source = ["skyward"]
parallel = true
sigterm = true
patch = ["subprocess"]

[dependency-groups]
dev = [
    "skyward[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0.0",
    "pytest-describe>=3.2",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1",
    "ruff>=0.9",
    "import-linter>=2.0",
    "jax>=0.8.2",
    "keras>=3.13.0",
    "scikit-learn>=1.8.0",
    "types-aioboto3[ec2,pricing]>=15.5.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.importlinter]
root_package = "skyward"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Folders are layers"
type = "layers"
layers = [
    "skyward.cli",
    "skyward.core",
    "skyward.server",
    "skyward.providers",
    "skyward.worker",
    "skyward.shared",
]
ignore_imports = [
    # The embedded transport: the client hosts the daemon in-process when asked to.
    "skyward.core.client -> skyward.server.http.app",
    # The joblib backend runs client-side only; the import is lazy and a node never reaches it.
    "skyward.worker.plugins.joblib -> skyward.core.function",
]

[tool.uv]
# casty is ours; opt it out of the global 7-day exclude-newer quarantine.
exclude-newer-package = { casty = "0 seconds" }
