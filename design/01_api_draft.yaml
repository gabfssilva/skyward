openapi: 3.1.0

info:
  title: Skyward Control Plane
  version: 0.1.0
  description: |
    Recursos do control plane do Skyward.

    Duas famílias de recurso, com formas diferentes de propósito:

    - **Declarativos** (`compute`, `node`): carregam `spec` (intenção) e `status`
      (observação). `PATCH` só toca `spec`; `status` é escrito pelo reconciler.
      Convergem por reconciliação e não têm operação assíncrona explícita —
      `generation` vs `status.observed_generation` é o progresso.
    - **Imperativos** (`task`): fatos append-only com um outcome terminal.
      Não convergem para nada. `executions` são as tentativas físicas.

    Não existe recurso `operation`. Um `POST`/`PATCH` aceito devolve o recurso
    já com a nova `revision`; o cliente observa o recurso, não um op-id.

servers:
  - url: http://127.0.0.1:7590/v1

tags:
  - name: computes
  - name: nodes
  - name: functions
  - name: tasks
  - name: blobs
  - name: events
  - name: catalog

paths:
  /computes:
    get:
      tags: [computes]
      summary: Lista computes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/ComputeState'
        - name: owned
          in: query
          description: Filtra por presença de owner vivo. `false` lista computes órfãos.
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeList'
    post:
      tags: [computes]
      summary: Cria um compute
      description: |
        Idempotente por `Idempotency-Key`. Mesma key + mesmo payload devolve o
        recurso original com `200`. Mesma key + payload diferente → `409
        IDEMPOTENCY_CONFLICT`.

        Não espera readiness. Devolve `status.state: REQUESTED` e o cliente
        observa por `GET` ou pelo stream de eventos.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeCreate'
      responses:
        '201':
          description: Criado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compute' }
        '200':
          description: Replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compute' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /computes/{compute_id}:
    parameters:
      - $ref: '#/components/parameters/ComputeId'
    get:
      tags: [computes]
      summary: Lê um compute
      description: Aceita `compute_id` ou `name`. A resposta sempre traz os dois.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compute' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [computes]
      summary: Altera a spec de um compute
      description: |
        Só `spec` é mutável. Alterar `spec.nodes` gera nova `generation` e o
        reconciler faz resize com drain. Alterar campos imutáveis (provider,
        image, worker, volumes, ports) é **drift**: registra
        `status.drift`, mantém a definição aplicada e não substitui
        infraestrutura. Substituição exige `POST /computes/{id}/apply`.

        `If-Match` com a `revision` esperada é obrigatório.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComputeSpecPatch' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compute' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [computes]
      summary: Marca o compute para destruição
      description: |
        Escreve `spec.desired: DELETED`. Não é síncrono e não é "detach":
        a reconciliação continua até o provider **confirmar ausência** dos
        recursos, e só então `status.state` vira `DELETED`.

        Fechar o cliente ou derrubar o daemon nunca produz este comando.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Delete aceito; convergência em curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compute' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /computes/{compute_id}/apply:
    parameters:
      - $ref: '#/components/parameters/ComputeId'
    post:
      tags: [computes]
      summary: Aplica um drift imutável (substituição de geração)
      description: |
        Quiesce, drena, destrói a geração antiga e provisiona a nova, com o
        mesmo `compute_id` e `generation + 1`. Tasks não resolvidas viram
        `INDETERMINATE` antes da substituição, salvo `force: false`, que
        recusa se houver executions ativas.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
      responses:
        '202':
          description: Substituição aceita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compute' }
        '409': { $ref: '#/components/responses/Conflict' }

  /computes/{compute_id}/lease:
    parameters:
      - $ref: '#/components/parameters/ComputeId'
    put:
      tags: [computes]
      summary: Reivindica ou renova o claim de ownership
      description: |
        Um compute tem no máximo um owner vivo por geração; zero é legítimo e
        temporário (daemon reiniciando, script morto).

        Reivindicar exige que a lease atual esteja vencida ou ausente — é um
        CAS. Renovar exige ser o owner corrente. Perder todas as renovações
        não apaga nada: se `spec.delete_on_exit` for `true`, o compute é
        destruído por reconciliação; se `false`, ele apenas fica sem dono até
        alguém adotá-lo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, ttl_seconds]
              properties:
                owner: { type: string, description: Identificador do processo/epoch que reivindica }
                ttl_seconds: { type: integer, minimum: 5 }
      responses:
        '200':
          description: Claim adquirido ou renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '409':
          description: Outro owner detém uma lease viva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [computes]
      summary: Libera o claim
      description: |
        Libera o ownership sem tocar em `spec.desired`. Um `sky.Compute` que
        sai do `with` limpo faz `DELETE /computes/{id}` (destrói) — não isto.
        Isto é para um daemon fazendo detach ordenado.
      responses:
        '204': { description: Liberado }

  /computes/{compute_id}/nodes:
    parameters:
      - $ref: '#/components/parameters/ComputeId'
    get:
      tags: [nodes]
      summary: Lista os nodes de um compute
      description: |
        Inclui nodes terminais (tombstones) por padrão — é o que garante que um
        nó morto não some do sistema. Use `include_terminal=false` para os vivos.
      parameters:
        - name: include_terminal
          in: query
          schema: { type: boolean, default: true }
        - name: generation
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'

  /computes/{compute_id}/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/ComputeId'
      - name: node_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [nodes]
      summary: Lê um node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [nodes]
      summary: Drena e substitui um node
      description: |
        Nodes não são criáveis diretamente — eles nascem da reconciliação de
        `compute.spec.nodes`. Mas um node pode ser condenado individualmente:
        `desired: DELETED` bloqueia novas assignments, espera as executions
        conhecidas e então destrói a instância.

        Se o compute ainda deseja aquela capacidade, o reconciler cria **outro
        node** para o mesmo `rank`, com `node_id` novo. O tombstone do antigo
        permanece com seu `provider_binding` até o terminate ser confirmado.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Drain aceito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }

  /functions:
    get:
      tags: [functions]
      summary: Lista funções registradas
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionList' }

  /functions/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    head:
      tags: [functions]
      summary: Verifica se a função já está registrada
      description: |
        O SDK chama isto antes de subir o blob. Uma função só sobe uma vez,
        por mais tasks que a chamem — é o content-addressing que torna
        `function` um recurso barato em vez de duplicação de pickle.
      responses:
        '200': { description: Já existe }
        '404': { description: Desconhecida }
    put:
      tags: [functions]
      summary: Registra uma função
      description: |
        O corpo é o envelope binário (cloudpickle + compressão). O servidor
        recomputa o hash sobre os bytes serializados antes da compressão e
        recusa se não bater com o path.

        Aceitar cloudpickle é aceitar execução de código arbitrário. No modo
        local single-user isso é explícito: o caller é o próprio usuário.
      parameters:
        - name: X-Skyward-Function-Name
          in: header
          schema: { type: string }
          description: Nome legível (qualname). Metadado, não identidade.
      requestBody:
        required: true
        content:
          application/vnd.skyward.blob:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Function' }
        '200':
          description: Já existia (no-op)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Function' }
        '400':
          description: Hash não confere com o corpo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [functions]
      summary: Lê os metadados de uma função
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Function' }
        '404': { $ref: '#/components/responses/NotFound' }

  /blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    head:
      tags: [blobs]
      summary: Verifica existência
      responses:
        '200': { description: Existe }
        '404': { description: Não existe }
    put:
      tags: [blobs]
      summary: Sobe um blob content-addressed (args ou resultado grande)
      description: |
        Args pequenos vão inline no `POST /tasks`. Acima do threshold, o SDK
        sobe aqui primeiro e a task referencia o hash.
      requestBody:
        required: true
        content:
          application/vnd.skyward.blob:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Criado }
        '200': { description: Já existia }
        '400':
          description: Hash não confere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [blobs]
      summary: Baixa um blob
      responses:
        '200':
          description: OK
          content:
            application/vnd.skyward.blob:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks:
    post:
      tags: [tasks]
      summary: Submete uma task
      description: |
        Uma task é **uma chamada**: `function` + `args` → `result`. É o que o
        `Future[T]` do SDK aponta, e o ID sobrevive a retries e a restart do
        SDK (`client.task(id)` reanexa).

        `dispatch: ONE` (operador `>>`) cria uma execution. `dispatch: ALL`
        (operador `@`) congela o conjunto de nodes `READY` no momento da
        admissão e cria uma execution por rank; scale-up posterior **não**
        acrescenta executions.

        A task é persistida com sua primeira execution **antes** de qualquer
        dispatch ao worker. O worker deduplica por
        `(task_id, execution_id, args_hash)`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Aceita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '200':
          description: Replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Compute não aceita tasks (deleting/deleted) ou função desconhecida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [tasks]
      summary: Lista tasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: compute
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/TaskState' }
        - name: correlation_id
          in: query
          description: Agrupa tasks de um `&`/`gather`/`map` sem criar um recurso agregador.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }

  /tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tasks]
      summary: Lê uma task
      description: |
        `state` é **derivado** das executions, nunca escrito em paralelo a elas.
        Isso elimina a divergência clássica entre "task" e "attempt".
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      summary: Cancela uma task
      description: |
        Antes de `STARTED`, cancelamento é garantido (CAS + ack do worker).
        Depois de `STARTED`, é best-effort: a execution entra em
        `CANCEL_REQUESTED` e só vira `CANCELLED` com confirmação de parada do
        worker. Sem confirmação, o desfecho é `INDETERMINATE` — nunca se
        declara cancelado um código Python que pode ainda estar rodando.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancelamento pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

  /tasks/{task_id}/retry:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tasks]
      summary: Cria uma nova execution para a mesma task
      description: |
        Retry **nunca** cria outra task: o `task_id` é o handle estável do
        usuário. Cria uma execution nova com `retry_of` apontando para a
        anterior.

        Retentar uma task `INDETERMINATE` exige `acknowledge_duplication:
        true`. O sistema não sabe se a execution anterior teve efeitos
        colaterais, e não vai fingir que sabe.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledge_duplication:
                  type: boolean
                  default: false
                  description: Obrigatório para retentar desfecho INDETERMINATE.
                ranks:
                  type: array
                  items: { type: integer }
                  description: Em broadcast, retenta só estes ranks. Omitido = os não-sucedidos.
      responses:
        '202':
          description: Execution criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '409':
          description: Task terminal sem opt-in, ou já há execution ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tasks/{task_id}/result:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tasks]
      summary: Baixa o resultado
      description: |
        O resultado permanece disponível depois de restart do controller e de
        restart do SDK, até `PurgeTask` explícito. Ele não é consumido pela
        leitura.

        Em `dispatch: ALL`, devolve os resultados ordenados por rank.
      parameters:
        - name: wait
          in: query
          description: Segundos a aguardar por um desfecho terminal antes de responder.
          schema: { type: integer, minimum: 0, maximum: 300, default: 0 }
      responses:
        '200':
          description: Desfecho terminal
          content:
            application/vnd.skyward.blob:
              schema: { type: string, format: binary }
        '204':
          description: Ainda sem desfecho (após `wait`)
        '409':
          description: Task terminou em FAILED/CANCELLED/TIMED_OUT/INDETERMINATE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events:
    get:
      tags: [events]
      summary: Stream de eventos (SSE)
      description: |
        `id:` de cada evento é o **sequence global**, monotônico. `Last-Event-ID`
        faz replay a partir do EventLog; o snapshot e o cursor são capturados na
        mesma ordem lógica, então não há gap entre "ler o estado" e "assinar".

        Não há GC automático de eventos, então qualquer cursor válido continua
        retomável.

        Consumidor lento não bloqueia commit: o adapter fecha a conexão quando
        a fila local estoura, e o cliente reconecta pelo último ID.

        stdout/stderr de task e output de bootstrap de nó são eventos aqui —
        não existe recurso `logs` com uma segunda fonte de verdade.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
        - name: compute
          in: query
          schema: { type: string }
        - name: task
          in: query
          schema: { type: string }
        - name: types
          in: query
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Stream
          content:
            text/event-stream:
              schema: { type: string }

  /providers:
    get:
      tags: [catalog]
      summary: Lista providers e suas capabilities
      description: |
        Read-only. Serve para capability negotiation antes de qualquer efeito:
        um provider sem `tags`, `lookup` e lease renovável não suporta o modo
        daemon e é recusado na criação, não no meio do provisionamento.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Provider' }

  /offers:
    get:
      tags: [catalog]
      summary: Consulta ofertas de instância
      parameters:
        - name: provider
          in: query
          schema: { type: string }
        - name: accelerator
          in: query
          schema: { type: string }
        - name: min_count
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }

components:

  parameters:
    ComputeId:
      name: compute_id
      in: path
      required: true
      description: ID opaco ou nome.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Mesma key + mesmo payload → resultado original. Mesma key + payload
        diferente → `409 IDEMPOTENCY_CONFLICT`. É o que torna seguro o cliente
        retentar um `POST` cuja resposta se perdeu.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: A `revision` esperada do recurso. Falha com `412` se mudou.
      schema: { type: string }

  headers:
    ETag:
      description: A `revision` corrente do recurso.
      schema: { type: string }

  responses:
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflito de idempotência ou de estado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: Revision divergente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Definição inválida ou não suportada no modo daemon
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - REVISION_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - LEASE_HELD
            - COMPUTE_NOT_ACCEPTING
            - UNSUPPORTED_PROVIDER
            - UNSUPPORTED_PLUGIN
            - SECRET_IN_DEFINITION
            - HASH_MISMATCH
            - TASK_FAILED
            - TASK_INDETERMINATE
            - DUPLICATION_NOT_ACKNOWLEDGED
            - CAPABILITY_MISMATCH
        message: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }

    # ---- compute -----------------------------------------------------------

    ComputeState:
      type: string
      enum: [REQUESTED, PROVISIONING, RECOVERING, READY, DEGRADED, DELETING, DELETED, FAILED]
      description: |
        `FAILED` é falha permanente ou budget de retry esgotado — erro retryable
        mantém o compute no estado corrente com `last_error` e um effect
        agendado. `DELETED` só após o provider confirmar ausência, nunca após o
        envio de um terminate.

    NodeBounds:
      type: object
      required: [desired]
      description: |
        `nodes=4` → `{desired: 4}`. `nodes=(2,8)` → `{min: 2, desired: 2, max: 8}`.
        `Nodes(desired=8, min=4)` → `{min: 4, desired: 8}`.
      properties:
        min: { type: integer, minimum: 1 }
        desired: { type: integer, minimum: 1 }
        max: { type: integer, minimum: 1 }

    ComputeSpec:
      type: object
      required: [specs, nodes]
      properties:
        specs:
          type: array
          minItems: 1
          description: Multi-spec fallback. `selection` decide entre elas.
          items: { $ref: '#/components/schemas/Spec' }
        selection:
          type: string
          enum: [cheapest, first]
          default: cheapest
        nodes: { $ref: '#/components/schemas/NodeBounds' }
        allocation:
          type: string
          enum: [spot, on-demand, spot-if-available, cheapest]
          default: spot-if-available
        image: { $ref: '#/components/schemas/Image' }
        worker: { $ref: '#/components/schemas/Worker' }
        plugins:
          type: array
          items: { $ref: '#/components/schemas/PluginRef' }
        volumes:
          type: array
          items: { type: object, additionalProperties: true }
        ports:
          type: array
          items: { type: object, additionalProperties: true }
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        delete_on_exit:
          type: boolean
          default: false
          description: |
            Imutável. `true` → quando a lease de ownership vence sem renovação,
            o compute é destruído por reconciliação. É o que faz um
            `sky.Compute` cujo processo levou SIGKILL não deixar nó órfão.
        desired:
          type: string
          enum: [RUNNING, DELETED]
          default: RUNNING
          readOnly: true
          description: Escrito por `DELETE`, nunca por `PATCH`.

    ComputeSpecPatch:
      type: object
      description: Só `nodes` é mutável sem substituição de geração.
      properties:
        nodes: { $ref: '#/components/schemas/NodeBounds' }

    ComputeCreate:
      type: object
      required: [spec]
      properties:
        name:
          type: string
          description: |
            Alias único. Tombstones reservam o nome até purge, para que eventos
            atrasados de um compute excluído não sejam atribuídos a outro.
        spec: { $ref: '#/components/schemas/ComputeSpec' }

    ComputeStatus:
      type: object
      properties:
        state: { $ref: '#/components/schemas/ComputeState' }
        observed_generation:
          type: integer
          description: |
            Progresso da reconciliação. `generation != observed_generation`
            significa que a intenção ainda não foi realizada — é isto que
            substitui um recurso `operation`.
        nodes_ready: { type: integer }
        nodes_total: { type: integer }
        drift:
          type: array
          description: Campos imutáveis alterados na spec e ainda não aplicados.
          items: { type: string }
        last_error: { $ref: '#/components/schemas/Error' }

    Lease:
      type: object
      properties:
        owner: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    Compute:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        revision:
          type: integer
          description: Muda em toda escrita. Sustenta o CAS via `If-Match`.
        generation:
          type: integer
          description: Muda só quando a intenção muda (spec ou desired).
        spec: { $ref: '#/components/schemas/ComputeSpec' }
        status: { $ref: '#/components/schemas/ComputeStatus' }
        lease: { $ref: '#/components/schemas/Lease' }
        created_at: { type: string, format: date-time }

    ComputeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Compute' }
        next_cursor: { type: string, nullable: true }

    # ---- node --------------------------------------------------------------

    NodeState:
      type: string
      enum: [REQUESTED, PROVISIONING, CONNECTING, BOOTSTRAPPING, READY, DRAINING, LOST, DELETING, DELETED, FAILED]

    Node:
      type: object
      properties:
        id:
          type: string
          description: |
            Identidade. Um substituto recebe outro `id`, mesmo reutilizando o
            `rank`. Nunca é o instance ID do provider.
        compute_id: { type: string }
        generation: { type: integer }
        rank:
          type: integer
          description: Endereçável pelo usuário (targeting, broadcast). Não é identidade.
        revision: { type: integer }
        desired:
          type: string
          enum: [PRESENT, DELETED]
        state: { $ref: '#/components/schemas/NodeState' }
        provider_binding:
          type: object
          description: |
            Tudo que o cleanup precisa: instance ID, região, chaves, volumes,
            snapshots, IDs auxiliares. Versionado pelo adapter. Estado que só
            existe no objeto provider em memória viola o contrato — é assim que
            um nó se perde.
          additionalProperties: true
        address: { type: string, nullable: true }
        accelerator: { type: string, nullable: true }
        price_per_hour: { type: number, nullable: true }
        last_error: { $ref: '#/components/schemas/Error' }
        created_at: { type: string, format: date-time }
        terminated_at: { type: string, format: date-time, nullable: true }

    NodeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Node' }

    # ---- function ----------------------------------------------------------

    Function:
      type: object
      properties:
        sha256: { type: string }
        name: { type: string, nullable: true }
        size_bytes: { type: integer }
        codec: { type: string, example: cloudpickle+lz4 }
        created_at: { type: string, format: date-time }

    FunctionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Function' }
        next_cursor: { type: string, nullable: true }

    # ---- task --------------------------------------------------------------

    Dispatch:
      type: string
      enum: [ONE, ALL]
      description: '`ONE` = operador `>>` (round-robin). `ALL` = operador `@` (broadcast).'

    TaskState:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, INDETERMINATE]
      description: |
        Derivado das executions. Todas as ranks com uma execution `SUCCEEDED` →
        `SUCCEEDED`. Alguma `FAILED` sem sucesso posterior → `FAILED`. Alguma
        `INDETERMINATE` sem sucesso posterior → `INDETERMINATE`.

    ExecutionState:
      type: string
      enum:
        - CREATED
        - ASSIGNED
        - DISPATCHING
        - ACCEPTED
        - STARTED
        - CANCEL_REQUESTED
        - SUCCEEDED
        - FAILED
        - CANCELLED
        - TIMED_OUT
        - INDETERMINATE
      description: |
        `ACCEPTED` = o worker gravou a identidade no ledger e assumiu a
        deduplicação; não prova que o código começou. `STARTED` é gravado
        imediatamente antes de invocar o código do usuário — é a fronteira
        entre "posso retentar com segurança" e "não sei o que aconteceu".

    Execution:
      type: object
      description: |
        Tentativa física. Não é recurso endereçável: é dado read-only da task.
        Só a task tem ID estável, porque é nela que o `Future` se apoia.
      properties:
        id: { type: string }
        node_id: { type: string, nullable: true }
        rank: { type: integer }
        ordinal:
          type: integer
          description: N-ésima tentativa daquele rank.
        retry_of: { type: string, nullable: true }
        state: { $ref: '#/components/schemas/ExecutionState' }
        result_sha256: { type: string, nullable: true }
        error: { $ref: '#/components/schemas/Error' }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    RetryPolicy:
      type: object
      description: |
        Substitui `retry_on_interruption=3`. A distinção é semântica, não numérica:
        retentar o que provadamente não começou é seguro; retentar o que pode
        ter rodado é uma decisão do usuário sobre efeitos colaterais.
      properties:
        safe_retries:
          type: integer
          default: 3
          description: Execution que nunca chegou a `STARTED` (preempção antes do início, node perdido no bootstrap).
        ambiguous_retries:
          type: integer
          default: 0
          description: Execution que chegou a `STARTED` e cujo desfecho se perdeu. Só > 0 se a função for idempotente.

    TaskCreate:
      type: object
      required: [compute, function, dispatch]
      properties:
        compute: { type: string, description: ID ou nome }
        function: { type: string, description: sha256 de uma função já registrada }
        args_inline:
          type: string
          format: byte
          description: Args pequenos, inline. Exclusivo com `args_sha256`.
        args_sha256:
          type: string
          description: Args grandes, subidos antes em `PUT /blobs/{sha256}`.
        dispatch: { $ref: '#/components/schemas/Dispatch' }
        rank:
          type: integer
          nullable: true
          description: Targeting. Só com `dispatch: ONE`.
        timeout_seconds:
          type: integer
          nullable: true
          description: |
            Vira um deadline wall-clock quando o controller aceita a task, e
            cobre fila + execução. `Future.result(timeout=)` continua sendo só
            espera local do cliente e não altera este deadline.
        retry: { $ref: '#/components/schemas/RetryPolicy' }
        correlation_id:
          type: string
          nullable: true
          description: Agrupa tasks de um `&`/`gather`/`map`. É campo, não recurso.

    Task:
      type: object
      properties:
        id: { type: string }
        compute_id: { type: string }
        generation: { type: integer }
        function: { type: string }
        args_sha256: { type: string }
        dispatch: { $ref: '#/components/schemas/Dispatch' }
        state: { $ref: '#/components/schemas/TaskState' }
        correlation_id: { type: string, nullable: true }
        deadline_at: { type: string, format: date-time, nullable: true }
        retry: { $ref: '#/components/schemas/RetryPolicy' }
        executions:
          type: array
          items: { $ref: '#/components/schemas/Execution' }
        result_sha256:
          type: string
          nullable: true
          description: Em `dispatch: ONE`. Em `ALL`, veja `executions[].result_sha256`.
        submitted_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    TaskList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor: { type: string, nullable: true }

    # ---- spec pieces -------------------------------------------------------

    Spec:
      type: object
      required: [provider]
      properties:
        provider: { $ref: '#/components/schemas/ProviderRef' }
        accelerator: { type: string, nullable: true }
        accelerator_count: { type: integer, default: 1 }
        cpus: { type: integer, nullable: true }
        memory_gb: { type: integer, nullable: true }
        region: { type: string, nullable: true }

    ProviderRef:
      type: object
      required: [kind]
      description: |
        Só dados. Credenciais **não** entram aqui — o controller as resolve do
        próprio ambiente. Uma definição com secret literal é recusada com
        `SECRET_IN_DEFINITION`.
      properties:
        kind:
          type: string
          example: aws
        config:
          type: object
          additionalProperties: true

    PluginRef:
      type: object
      required: [kind]
      description: |
        Plugin built-in identificado por nome + parâmetros. Plugin custom com
        callable não é persistível e é recusado — o modo direto continua sendo
        o escape hatch para isso.
      properties:
        kind: { type: string, example: torch }
        params:
          type: object
          additionalProperties: true

    Image:
      type: object
      properties:
        base: { type: string, nullable: true }
        python: { type: string, nullable: true }
        packages:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: Sem secrets. Valores sensíveis são recusados na validação.

    Worker:
      type: object
      properties:
        concurrency: { type: integer, nullable: true }
        executor:
          type: string
          enum: [thread, process]
          nullable: true

    # ---- catalog -----------------------------------------------------------

    Provider:
      type: object
      properties:
        kind: { type: string }
        credentials_resolvable: { type: boolean }
        daemon_supported:
          type: boolean
          description: |
            Exige tags, lookup por tag e lease renovável de auto-shutdown. Sem
            isso não há como recuperar um create cujo commit se perdeu, e o
            provider fica restrito ao modo direto.
        capabilities:
          type: array
          items:
            type: string
            enum: [spot, warm_images, mounts, ports, tags, lookup, lease]

    Offer:
      type: object
      properties:
        provider: { type: string }
        instance_type: { type: string }
        accelerator: { type: string, nullable: true }
        accelerator_count: { type: integer }
        cpus: { type: integer }
        memory_gb: { type: number }
        region: { type: string }
        price_per_hour: { type: number }
        spot: { type: boolean }
        available: { type: integer, nullable: true }
